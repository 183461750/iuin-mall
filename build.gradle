import org.springframework.boot.gradle.plugin.SpringBootPlugin
import org.gradle.api.JavaVersion

// 1. 使用 plugins {} 块集中管理插件版本，并应用到所有子项目
plugins {
    // 将插件应用到根项目，并通过 allprojects/subprojects 传递配置
    id 'base'
    id 'java-library'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    // 可选：如果使用QueryDSL插件
    id "com.ewerk.gradle.plugins.querydsl" version "1.0.10"

    // 自定义插件
    id 'io.github.iuin8.remote' version '1.4.8'
}

group = "com.iuin"
version = projectVersion

// Gradle Wrapper配置，确保使用兼容Java 17的版本
wrapper {
    gradleVersion = '8.14.2' // 使用最新的兼容版本
    distributionUrl = 'https://services.gradle.org/distributions/gradle-8.14.2-bin.zip'
}

def secretsFile = file("support-dependencies/configs/secrets/gradle/secrets.properties")
if (secretsFile.exists()) {
    println("[build]加载本地密文")
    def props = new Properties()
    secretsFile.withInputStream { props.load(it) }
    props.each { k, v -> project.ext[k as String] = v }
}

// 2. 使用 allprojects 为所有项目（包括根项目和子项目）进行通用配置
allprojects {
    // 基础配置对所有项目都适用
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // 统一配置依赖
    configurations {
        compileOnly {}
    }

    // 配置Java 17
    java {
        // 使用Java Toolchain（推荐做法） 这是Gradle官方最推荐的方式。它允许你声明项目所需的JDK版本，而无需关心每个开发者机器上JDK的具体安装路径。Gradle会自动检测系统中符合要求的JDK，甚至可以在没有时自动下载。
        // 这种方式能最大程度地保证团队环境和CI/CD环境的一致性
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
            // vendor = JvmVendorSpec.ADOPTIUM // 可选：指定供应商，如Eclipse Temurin
        }
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    apply plugin: 'java'
    apply plugin: 'java-library'

    // 根据项目路径应用不同的插件
    if (path != ':component:pluggable-annotation:compile-time-code-gen') {
        // compile-time-code-gen模块特殊处理
        // 其他项目正常应用所有插件
        apply plugin: 'org.springframework.boot'
        apply plugin: 'io.spring.dependency-management'
    }

}

// 3. 使用 subprojects 为所有子项目进行通用配置
subprojects {

    dependencies {
        // 所有子项目都依赖 Lombok，版本由 Spring Boot BOM 管理
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
    }

    // 3.4 统一管理依赖版本 (BOM)
    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:${springCloudAlibabaVersion}"
            mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
            mavenBom "org.camunda.bpm:camunda-bom:${sb_camundaBpmVersion}"
        }
        // 这里可以继续定义不在 BOM 中的依赖版本
        dependencies {

            dependency 'com.dtflys.forest:forest-spring-boot-starter:1.5.26'

            // annotationProcessor
			dependency "com.querydsl:querydsl-apt:${querydslVersion}"
            dependency 'org.hibernate:hibernate-jpamodelgen:6.2.6.Final'
            dependency("org.hibernate.javax.persistence:hibernate-jpa-2.1-api:1.0.2.Final")
            dependency("javax.annotation:javax.annotation-api:1.3.2")

            // common
            dependency 'cn.hutool:hutool-all:5.8.0'
            // https://mvnrepository.com/artifact/com.google.guava/guava
            dependency 'com.google.guava:guava:31.1-jre'
            dependency 'io.github.yoshikawaa.modelmapper.spring.boot:modelmapper-spring-boot-autoconfigure:0.1.0'

            // Sa-Token
            // Sa-Token 权限认证，在线文档：https://sa-token.cc
            dependency 'cn.dev33:sa-token-spring-boot-starter:1.37.0'

            // Sa-Token 插件：整合SSO
            dependency 'cn.dev33:sa-token-sso:1.37.0'

            // Sa-Token 整合 Redis (使用 jackson 序列化方式)
            dependency 'cn.dev33:sa-token-redis-jackson:1.37.0'

            //arthas
            dependency 'com.taobao.arthas:arthas-spring-boot-starter:3.7.2'

            // skywalking
            dependency 'net.logstash.logback:logstash-logback-encoder:7.4'
            dependency 'org.apache.skywalking:apm-toolkit-logback-1.x:9.2.0'
            dependency('org.apache.skywalking:apm-toolkit-trace:9.2.0')
            dependency('org.apache.skywalking:apm-toolkit-webflux:9.2.0')

            // mybatis plus
            dependency 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.6'
            dependency 'com.github.yulichang:mybatis-plus-join-boot-starter:1.4.6'

        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}