
nacos:
  server-addr: 10.0.16.146:8848
  namespace: dev
  group: v1
  register-enabled: true
  metadata:
    # 自己的版本使用变量示例: Fa-${nacos.namespace}-version 加上 register-enabled:true 实现灰度发布自己的服务, 并配合添加请求头 nacos-version 实现路由到自己的灰度版本中
    nacos-version: ${nacos.namespace}-version

server:
  port: 9002
  tomcat:
    uri-encoding: UTF-8
  max-http-request-header-size: 50KB

spring:
  config:
    import:
      - nacos:common.${spring.cloud.nacos.config.file-extension}?refreshEnabled=true&group=${nacos.group}
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}?refreshEnabled=true&group=${nacos.group}
      - nacos:common-logback.xml?refreshEnabled=true&group=${nacos.group}
  cloud:
    loadbalancer:
      nacos:
        enabled: true
    nacos:
      discovery:
        server-addr: ${nacos.server-addr}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        register-enabled: ${nacos.register-enabled:true}
        metadata:
          nacos-version: ${nacos.metadata.nacos-version:${nacos.namespace}-version}
      config:
        server-addr: ${nacos.server-addr}
        file-extension: yml
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        prefix: ${spring.application.name}
      server-addr: ${nacos.server-addr}
      username: ${nacos.username}
      password: ${nacos.password}

  datasource:
    url: jdbc:postgresql://${pgsql.address}:${pgsql.port}/${pgsql.dbname}?stringtype=unspecified
    username: ${pgsql.username}
    password: ${pgsql.password}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: ${hikari.minimum_idle}
      maximum-pool-size: ${hikari.maximum_pool_size}
      auto-commit: true
      idle-timeout: 30000
      pool-name: ${spring.application.name}-HikariPool
      max-lifetime: 1800000
      connection-timeout: 30000
  data:
    redis:
      host: ${redis.address}
      port: ${redis.port}
      password: ${redis.password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    mcp:
      server:
        enabled: true
        name: agent-mcp-server
        version: 1.0.0
      client:
        enabled: true
        name: agent-mcp-client
        version: 1.0.0
        type: SYNC
#        sse:
#          connections:
#            default:
#              url: http://localhost:8080/mcp/message
    deepseek:
      api-key: ${deepseek.api-key}
      base-url: ${deepseek.base-url:-https://api.deepseek.com/v1}
