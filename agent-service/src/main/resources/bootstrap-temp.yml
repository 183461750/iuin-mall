server:
  port: 9002
  tomcat:
    uri-encoding: UTF-8
  max-http-request-header-size: 50KB

spring:
  datasource:
    url: jdbc:postgresql://${pgsql.address}:${pgsql.port}/${pgsql.dbname}?stringtype=unspecified
    username: ${pgsql.username}
    password: ${pgsql.password}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: ${hikari.minimum_idle}
      maximum-pool-size: ${hikari.maximum_pool_size}
      auto-commit: true
      idle-timeout: 30000
      pool-name: ${spring.application.name}-HikariPool
      max-lifetime: 1800000
      connection-timeout: 30000
  data:
    redis:
      host: ${redis.address}
      port: ${redis.port}
      password: ${redis.password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    mcp:
      server:
        enabled: true
        name: agent-mcp-server
        version: 1.0.0
      client:
        enabled: true
        name: agent-mcp-client
        version: 1.0.0
        type: SYNC
#        sse:
#          connections:
#            default:
#              url: http://localhost:8080/mcp/message
    deepseek:
      api-key: ${deepseek.api-key}
      base-url: ${deepseek.base-url:-https://api.deepseek.com/v1}
