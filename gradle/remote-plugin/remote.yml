
environments:
  dev:
    extends: base
    ssh:
      server: dev.intranet.iuin
    jenkins:
      job: "iuin-mall-后端(dev环境)"
  test:
    extends: base
    ssh:
      server: test.dj.ssy.company
    jenkins:
      job: "iuin-mall-后端(Test环境)"
  uat:
    extends: base
    ssh:
      server: uat.dj.ssy.company
    jenkins:
      job: "iuin-mall-后端(UAT环境)"
    start:
      need_confirm: true

  prod:
    extends: base
    ssh:
      server: prod.dj.ssy.company
    jenkins:
      job: "iuin-mall-后端(Prod环境)"

common:
  base:
    jenkins:
      url: "https://your-jenkins-url.com"
      user: "your_username"
      token: "your_api_token"
    remote:
      base_dir: /data/iuin-mall
    start:
      #    command: $REMOTE_BASE_DIR/$SERVICE_NAME/$SERVICE_NAME-start.sh
      command: sudo systemctl restart $SERVICE_NAME
    env:
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:3$SERVICE_PORT
    log:
      filePattern: ${REMOTE_BASE_DIR}/../logs/${service}.log
    service_ports:
      agent-service: 8888
      mcp-service: 8888
      sso-server-service: 8888
      commodity-service: 8888
