// 全新的compile-time-code-gen模块配置 - 专注于Java 17兼容性

// 应用Java库插件
plugins {
    id 'java-library'
    id 'maven-publish'
}

// 基本项目信息
group = 'com.iuin.component.pluggable-annotation'
version = '1.0.0-SNAPSHOT'

// 明确配置Java 17
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// 配置仓库
repositories {
    mavenLocal()
    mavenCentral()
}

// 只包含必要的依赖
dependencies {
    // 使用Maven中央仓库中的Lombok依赖
    implementation 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    
    // 测试依赖
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
}

// 编译任务配置
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.jvmArgs += '--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
    options.forkOptions.jvmArgs += '--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED'
    options.forkOptions.jvmArgs += '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED'
    options.forkOptions.jvmArgs += '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
    options.forkOptions.jvmArgs += '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED'
    options.compilerArgs += ['--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED']
    options.compilerArgs += ['--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED']
    options.compilerArgs += ['--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED']
    options.compilerArgs += ['--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED']
    options.compilerArgs += ['--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED']
}

// 测试配置
test {
    useJUnitPlatform()
}

// Maven发布配置
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
