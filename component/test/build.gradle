// 保持默认编译设置，不添加任何额外 JVM 参数
// 需要依赖包
jar.enabled = true
// 无需启动包
bootJar.enabled = false

// 由 com.iuin.meta-constants 插件自动配置 JavaCompile 的 add-exports 与 -Xplugin

dependencies {
    implementation project(':common')
//    implementation project(':common-dependencies')
    implementation project(':component:base-spring-boot-starter')

    implementation project(':component:pluggable-annotation:compile-time-code-gen')
    annotationProcessor project(':component:pluggable-annotation:compile-time-code-gen')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // https://mvnrepository.com/artifact/org.apache.tika/tika-core
//    implementation 'org.apache.tika:tika-core:2.8.0'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor "org.mapstruct:mapstruct-processor:1.5.5.Final"

}

test {
    useJUnitPlatform()
}
