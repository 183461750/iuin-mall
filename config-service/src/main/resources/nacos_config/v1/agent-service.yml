spring:
  application:
    name: agent-service
  datasource:
    url: jdbc:postgresql://localhost:5432/yourdb
    username: postgres
    password: yourpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    mcp:
      server:
        enabled: true
        name: agent-mcp-server
        version: 1.0.0
        sse:
          endpoint: /mcp/message
      client:
        enabled: true
        name: agent-mcp-client
        version: 1.0.0
        type: SYNC
        sse:
          connections:
            default:
              url: http://localhost:8080/mcp/message
    deepseek:
      api-key: sk-xxx-your-key
      base-url: https://api.deepseek.com/v1
      mcp:
        enabled: true 